name: Android host validation
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Build and validate the Android app
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain --no-configuration-cache --max-workers=2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ember-host-validation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            app/build/test-results/
